[project]
name = "extracao-documentos"
version = "0.1.0"
description = "Extração e validação de documentos admissionais"
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "boto3>=1.43,<2",
    "structlog>=26.1",
    "pillow>=13,<14",
    "pillow-heif>=1.8,<2",
    "pypdfium2>=5.14,<6",
    # Não headless: o PaddleX confere este nome de pacote ao importar os módulos de OCR.
    "opencv-contrib-python>=4.10,<5",
    "openai>=3.44,<4",
    "numpy>=2",
    "validate-docbr==2.0.1",
]

[project.scripts]
avaliar = "avaliacao.cli:main_avaliar"
gabarito = "avaliacao.cli:main_gabarito"
comparar = "avaliacao.cli:main_comparar"
limpeza = "app.armazenamento.limpeza:main"
medir-ocr = "avaliacao.medir_ocr:main"
revisao = "avaliacao.revisao:main"
trabalhador = "app.trabalhador:main"
tabelas = "app.regras.tabelas.atualizar:main"

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.7,<4",
    "paddlepaddle>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
    "moto[s3]>=5.2",
    "jsonschema>=4.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "avaliacao"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "ASYNC"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # acentos em strings e comentários são intencionais
    "S101",                        # assert em testes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "PT011", "PT018", "E501"]
"avaliacao/relatorio.py" = ["E501"]  # linhas de tabela Markdown

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "moto.*", "pypdfium2.*", "pillow_heif.*", "jsonschema.*", "referencing.*", "paddleocr.*", "paddle.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not provider_real and not integracao and not ocr_real'"
markers = [
    "provider_real: chama provider real (nunca roda por padrão)",
    "ocr_real: roda o PaddleOCR de verdade (precisa do extra `ocr` e dos pesos)",
    "integracao: depende de Postgres e S3 reais (make test-integracao)",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "error::DeprecationWarning:avaliacao.*",
    # Aviso do starlette sobre o httpx usado pelo TestClient; não afeta o serviço.
    "ignore:Using `httpx` with `starlette.testclient`",
]

