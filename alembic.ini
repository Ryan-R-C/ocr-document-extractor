[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# A URL vem de app.config (DATABASE_URL); não fica aqui.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
